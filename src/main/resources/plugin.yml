name: JavaRestart
version: ${project.version}
main: ru.javaroot.jrestart.JRestart
api-version: 1.21
authors: [JavaRoot]
commands:
  jrestart:
    description: главная команда
    usage: /jrestart
permissions:
  jrestart.use:
    description: использование команд
    default: true
  jrestart.vote:
    description: голос рестарта
    default: true
  jrestart.admin:
    description: адм пермс
    default: op
    children:
      jrestart.use: true
      jrestart.vote: true
